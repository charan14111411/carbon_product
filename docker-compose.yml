name: varsapradaya-carbon
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: vcarbon
      POSTGRES_USER: vcarbon
      POSTGRES_PASSWORD: vcarbon_dev
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcarbon -d vcarbon"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  dbdata:
